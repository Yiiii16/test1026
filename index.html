<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个 GitHub 项目</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f0f5ff; font-family: "Microsoft YaHei", sans-serif; color: #172554; }
    main { width: min(480px, 85vw); padding: 36px; background: white; border-radius: 20px; box-shadow: 0 16px 48px #17255415; text-align: center; }
    h1 { font-size: 26px; }
    p { line-height: 1.8; }
    button { padding: 12px 24px; border: 0; border-radius: 10px; background: #2563eb; color: white; font-size: 16px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 4px; }
    #result { min-height: 30px; color: #2563eb; }
  </style>
</head>
<body>
  <main>
    <h1>你好，GitHub！</h1>
    <p>这是我的第一个测试项目：test1026。</p>
    <p>点击下面的按钮，测试 JavaScript 是否正常运行。</p>
    <button id="test-button" type="button">点击测试</button>
    <button id="reset-button" type="button">重置次数</button>
    <p id="result" role="status">等待你的第一次点击……</p>
    <small>刷新页面后，点击次数会重置。</small>
  </main>
  <script>
    // 保存本次打开页面后的点击次数。
    let count = 0;
    const button = document.getElementById('test-button');
    const result = document.getElementById('result');
    const resetButton = document.getElementById('reset-button');

    button.addEventListener('click', () => {
      count += 1;
      result.textContent = `测试成功！你已经点击了 ${count} 次。`;
    });
    // 用于练习在 Visual Studio 中提交和推送的新功能。
    resetButton.addEventListener('click', () => {
      count = 0;
      result.textContent = '点击次数已重置，现在可以重新测试。';
    });
  </script>
</body>
</html>
